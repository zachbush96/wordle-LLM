study_id: SFT-GRPO-HYBRID-001
purpose: dev-only staged SFT warm start followed by stability-guarded GRPO
protocol_id: WORDLE-PROTOCOL-002
test_access: forbidden
model_id: google/gemma-3-270m-it
model_revision: ac82b4e820549b854eebf28ce6dedaf9fdfa17b3
pipeline: [sft, grpo]
seed: 1337
stages:
  sft:
    method: sft
    parent_checkpoint: base
    representation: non_reasoning_single_step
    max_steps: 100
    learning_rate: 0.0002
    batch_size: 4
    gradient_accumulation_steps: 4
  grpo:
    method: grpo
    parent_from: sft.final_checkpoint
    max_steps: 100
    learning_rate: 0.000001
    batch_size: 2
    gradient_accumulation_steps: 8
    group_size: 8
    temperature: 1.0
    reward_rubric:
      version: wordle-shaped-v1
      weights:
        solve: 5.0
        information_gain: 1.0
        oracle_regret: -1.0
        repeat: -2.0
        format: -3.0
    virtual_support:
      enabled: true
      collapse_std_threshold: 0.000001
      alpha: 0.5
      zero_reward_anchor: 0.1
      adaptive_threshold_initial: 0.5
      adaptive_eta: 0.01
      normalization_epsilon: 0.000001
      usage: advantage_estimation_only
    stability:
      advantage_std_threshold: 0.000001
      maximum_advantage_collapse_rate: 0.80
      minimum_groups_before_stop: 10
      entropy_guard:
        baseline_window: 5
        minimum_observations: 8
        absolute_floor: 0.25
        relative_floor: 0.35
        patience: 3
promotion_gate:
  split: dev
  require_checkpoint: true
  thresholds:
    terminal_compliance: {op: ">=", value: 0.99}
    invalid_guess_rate: {op: "<=", value: 0.10}
    repeat_guess_rate: {op: "<=", value: 0.10}
    turn_2_posterior_violation_rate: {op: "<=", value: 0.30}
    singleton_answer_accuracy: {op: ">=", value: 0.80}
